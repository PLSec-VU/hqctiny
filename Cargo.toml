[workspace]
members = ["hqctiny-cli"]

[package]
name = "HQCTiny"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.5"
chacha20poly1305 = "0.10"
serde = { version = "1.0", features = ["derive"] }
rand = "0.10"
hex = "0.4"
bytemuck = "1.14"
clmul = "0.8"
lazy_static = "1.4"
subtle = "2.5"
serde_json = "1.0"
zeroize = { version = "1.9", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[build-dependencies]
cc = "1.0"

[[bench]]
name = "interpolate"
harness = false