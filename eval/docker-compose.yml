services:
  server:
    build:
      context: ..
      dockerfile: eval/Dockerfile
    image: ${EVAL_IMAGE:-hqclethe-eval}
    volumes:
      - ..:/work
      - cargo-registry:/usr/local/cargo/registry
    working_dir: /work
    environment:
      - CARGO_TARGET_DIR=/work/target-linux
      - PYTHONDONTWRITEBYTECODE=1
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    command: sleep infinity
    tty: true

  client:
    image: ${EVAL_IMAGE:-hqclethe-eval}
    volumes:
      - ..:/work
      - cargo-registry:/usr/local/cargo/registry
    working_dir: /work
    environment:
      - CARGO_TARGET_DIR=/work/target-linux
      - PYTHONDONTWRITEBYTECODE=1
    cap_add:
      - NET_ADMIN
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    command: sleep infinity
    tty: true
    depends_on:
      - server

volumes:
  cargo-registry:
