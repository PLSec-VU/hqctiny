[package]
name = "hqclethe-client"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.35", features = ["net", "rt-multi-thread", "macros", "time"] }
rand = "0.9"
serde_json = "1.0"
HQCLethe = { path = ".." }

[features]
# Compiles out the printed session key: a true nop rather than a
# runtime-suppressed print, so benchmark measurements aren't perturbed.
quiet = []
# Links the AVX2 build of HQC (x86 only); see the root crate's feature.
avx2 = ["HQCLethe/avx2"]
